name: Feature request
description: An idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Anything the server would need to learn for this to work?
      description: Gizleme's rule is that the relay learns as little as possible — say so if your idea needs more.
